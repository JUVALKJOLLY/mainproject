{% extends 'base.html' %}

{% block content %}

    <h2>System Login</h2>

    {% if form.errors %}
        <p style="color: red;">Invalid Username or Password</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>

        </form>

{% endblock %}
